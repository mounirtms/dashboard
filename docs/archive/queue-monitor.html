<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Monitor Dashboard - TechnoStationery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #666;
            font-size: 1.2em;
        }

        .last-update {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .environment-selector {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .env-button {
            background: #f5f5f5;
            border: 2px solid #ddd;
            padding: 12px 30px;
            margin: 0 10px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .env-button:hover {
            background: #e0e0e0;
        }

        .env-button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .metric-card.critical {
            border-left: 5px solid #f44336;
        }

        .metric-card.warning {
            border-left: 5px solid #ff9800;
        }

        .metric-card.success {
            border-left: 5px solid #4caf50;
        }

        .metric-card.info {
            border-left: 5px solid #2196f3;
        }

        .metric-label {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .metric-change {
            font-size: 0.9em;
            padding: 5px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .metric-change.positive {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .metric-change.negative {
            background: #ffebee;
            color: #c62828;
        }

        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .chart-header {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .status-bar {
            display: flex;
            height: 40px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .status-segment {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: all 0.3s;
        }

        .status-segment:hover {
            opacity: 0.8;
        }

        .status-pending {
            background: #2196f3;
        }

        .status-processing {
            background: #ff9800;
        }

        .status-failed {
            background: #f44336;
        }

        .status-complete {
            background: #4caf50;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .action-button {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .action-button.primary {
            background: #667eea;
            color: white;
        }

        .action-button.danger {
            background: #f44336;
            color: white;
        }

        .action-button.success {
            background: #4caf50;
            color: white;
        }

        .details-table {
            width: 100%;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .details-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .details-table th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .details-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .details-table tr:hover {
            background: #f5f5f5;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            display: inline-block;
        }

        .status-badge.healthy {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-badge.warning {
            background: #fff3e0;
            color: #e65100;
        }

        .status-badge.critical {
            background: #ffebee;
            color: #c62828;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .alert.critical {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🔧 Queue Monitor Dashboard</h1>
            <p class="subtitle">Real-time Queue & System Monitoring</p>
            <div class="last-update" id="lastUpdate">Last updated: Loading...</div>
        </div>

        <div class="environment-selector">
            <button class="env-button active" onclick="switchEnvironment('production')">Production</button>
            <button class="env-button" onclick="switchEnvironment('beta')">Beta</button>
            <button class="env-button" onclick="switchEnvironment('dev')">Dev</button>
        </div>

        <div id="alerts"></div>

        <div class="action-buttons">
            <button class="action-button primary" onclick="refreshData()">
                🔄 Refresh Data
            </button>
            <button class="action-button success" onclick="runCleanup()">
                🧹 Run Cleanup
            </button>
            <button class="action-button danger" onclick="emergencyCleanup()">
                🚨 Emergency Cleanup
            </button>
        </div>

        <div class="metrics-grid" id="metricsGrid">
            <div class="loading">
                <div class="spinner"></div>
                Loading metrics...
            </div>
        </div>

        <div class="chart-container">
            <h3 class="chart-header">Queue Status Distribution</h3>
            <div class="status-bar" id="statusBar">
                <div class="loading">Loading...</div>
            </div>
            <div id="statusLegend"></div>
        </div>

        <div class="details-table">
            <table>
                <thead>
                    <tr>
                        <th>Metric</th>
                        <th>Current Value</th>
                        <th>Threshold</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="detailsTable">
                    <tr>
                        <td colspan="4" class="loading">Loading details...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            <p>TechnoStationery Queue Monitor &copy; 2026</p>
            <p>Monitoring Production, Beta, and Dev Environments</p>
        </div>
    </div>

    <script>
        let currentEnvironment = 'production';
        let autoRefreshInterval = null;

        const environmentConfig = {
            production: {
                name: 'Production',
                color: '#f44336',
                statusFile: '/logs/queue_status_production.json'
            },
            beta: {
                name: 'Beta',
                color: '#ff9800',
                statusFile: '/logs/queue_status_beta.json'
            },
            dev: {
                name: 'Dev',
                color: '#4caf50',
                statusFile: '/logs/queue_status_dev.json'
            }
        };

        function switchEnvironment(env) {
            currentEnvironment = env;
            
            // Update button states
            document.querySelectorAll('.env-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Refresh data
            refreshData();
        }

        async function refreshData() {
            try {
                // In a real implementation, this would fetch from the API
                // For now, we'll use sample data
                const sampleData = generateSampleData();
                updateDashboard(sampleData);
                
                document.getElementById('lastUpdate').textContent = 
                    `Last updated: ${new Date().toLocaleString()}`;
            } catch (error) {
                console.error('Error refreshing data:', error);
                showAlert('Failed to refresh data', 'critical');
            }
        }

        function generateSampleData() {
            // Sample data for demonstration
            return {
                timestamp: new Date().toISOString(),
                environment: currentEnvironment,
                queue: {
                    total: Math.floor(Math.random() * 5000) + 1000,
                    pending: Math.floor(Math.random() * 1000),
                    processing: Math.floor(Math.random() * 100),
                    failed: Math.floor(Math.random() * 50),
                    complete: Math.floor(Math.random() * 3000)
                },
                cpu: {
                    usage: (Math.random() * 30 + 40).toFixed(1)
                },
                consumers: {
                    active: Math.floor(Math.random() * 10) + 5
                },
                cron: {
                    total: Math.floor(Math.random() * 50000) + 10000
                }
            };
        }

        function updateDashboard(data) {
            updateMetrics(data);
            updateStatusBar(data);
            updateDetailsTable(data);
            checkAlerts(data);
        }

        function updateMetrics(data) {
            const metrics = [
                {
                    label: 'Total Queue Jobs',
                    value: data.queue.total.toLocaleString(),
                    status: data.queue.total > 10000 ? 'critical' : 
                            data.queue.total > 5000 ? 'warning' : 'success',
                    change: `-${Math.floor(Math.random() * 1000)}`,
                    changeType: 'positive'
                },
                {
                    label: 'Pending Jobs',
                    value: data.queue.pending.toLocaleString(),
                    status: 'info',
                    change: `${Math.floor(Math.random() * 100)}`,
                    changeType: 'negative'
                },
                {
                    label: 'Failed Jobs',
                    value: data.queue.failed.toLocaleString(),
                    status: data.queue.failed > 100 ? 'warning' : 'success',
                    change: `-${Math.floor(Math.random() * 20)}`,
                    changeType: 'positive'
                },
                {
                    label: 'CPU Usage',
                    value: `${data.cpu.usage}%`,
                    status: data.cpu.usage > 80 ? 'critical' : 
                            data.cpu.usage > 60 ? 'warning' : 'success',
                    change: `-${(Math.random() * 10).toFixed(1)}%`,
                    changeType: 'positive'
                },
                {
                    label: 'Active Consumers',
                    value: data.consumers.active,
                    status: 'info',
                    change: `${Math.floor(Math.random() * 3)}`,
                    changeType: 'positive'
                },
                {
                    label: 'Cron Entries',
                    value: data.cron.total.toLocaleString(),
                    status: data.cron.total > 50000 ? 'warning' : 'success',
                    change: `-${Math.floor(Math.random() * 5000)}`,
                    changeType: 'positive'
                }
            ];

            const grid = document.getElementById('metricsGrid');
            grid.innerHTML = metrics.map(metric => `
                <div class="metric-card ${metric.status}">
                    <div class="metric-label">${metric.label}</div>
                    <div class="metric-value">${metric.value}</div>
                    <div class="metric-change ${metric.changeType}">
                        ${metric.changeType === 'positive' ? '↓' : '↑'} ${metric.change}
                    </div>
                </div>
            `).join('');
        }

        function updateStatusBar(data) {
            const total = data.queue.total;
            const pending = (data.queue.pending / total * 100).toFixed(1);
            const processing = (data.queue.processing / total * 100).toFixed(1);
            const failed = (data.queue.failed / total * 100).toFixed(1);
            const complete = (data.queue.complete / total * 100).toFixed(1);

            const bar = document.getElementById('statusBar');
            bar.innerHTML = `
                <div class="status-segment status-pending" style="width: ${pending}%">
                    ${pending}% Pending
                </div>
                <div class="status-segment status-processing" style="width: ${processing}%">
                    ${processing}% Processing
                </div>
                <div class="status-segment status-failed" style="width: ${failed}%">
                    ${failed}% Failed
                </div>
                <div class="status-segment status-complete" style="width: ${complete}%">
                    ${complete}% Complete
                </div>
            `;

            const legend = document.getElementById('statusLegend');
            legend.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px;">
                    <div>
                        <strong>Pending:</strong> ${data.queue.pending.toLocaleString()}
                    </div>
                    <div>
                        <strong>Processing:</strong> ${data.queue.processing.toLocaleString()}
                    </div>
                    <div>
                        <strong>Failed:</strong> ${data.queue.failed.toLocaleString()}
                    </div>
                    <div>
                        <strong>Complete:</strong> ${data.queue.complete.toLocaleString()}
                    </div>
                </div>
            `;
        }

        function updateDetailsTable(data) {
            const details = [
                {
                    metric: 'Queue Size',
                    value: data.queue.total.toLocaleString(),
                    threshold: '10,000',
                    status: data.queue.total > 10000 ? 'critical' : 
                            data.queue.total > 5000 ? 'warning' : 'healthy'
                },
                {
                    metric: 'CPU Usage',
                    value: `${data.cpu.usage}%`,
                    threshold: '80%',
                    status: data.cpu.usage > 80 ? 'critical' : 
                            data.cpu.usage > 60 ? 'warning' : 'healthy'
                },
                {
                    metric: 'Failed Jobs',
                    value: data.queue.failed.toLocaleString(),
                    threshold: '100',
                    status: data.queue.failed > 100 ? 'warning' : 'healthy'
                },
                {
                    metric: 'Active Consumers',
                    value: data.consumers.active,
                    threshold: '15',
                    status: data.consumers.active > 15 ? 'warning' : 'healthy'
                }
            ];

            const table = document.getElementById('detailsTable');
            table.innerHTML = details.map(detail => `
                <tr>
                    <td><strong>${detail.metric}</strong></td>
                    <td>${detail.value}</td>
                    <td>${detail.threshold}</td>
                    <td>
                        <span class="status-badge ${detail.status}">
                            ${detail.status.toUpperCase()}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function checkAlerts(data) {
            const alerts = [];

            if (data.queue.total > 10000) {
                alerts.push({
                    type: 'critical',
                    message: `⚠️ CRITICAL: Queue size (${data.queue.total.toLocaleString()}) exceeds 10,000 jobs. Immediate cleanup recommended!`
                });
            }

            if (data.cpu.usage > 80) {
                alerts.push({
                    type: 'critical',
                    message: `⚠️ CRITICAL: CPU usage (${data.cpu.usage}%) is above 80%. System performance degraded!`
                });
            }

            if (data.queue.failed > 100) {
                alerts.push({
                    type: 'warning',
                    message: `⚠️ WARNING: ${data.queue.failed} failed jobs detected. Review and cleanup recommended.`
                });
            }

            const alertsDiv = document.getElementById('alerts');
            if (alerts.length > 0) {
                alertsDiv.innerHTML = alerts.map(alert => `
                    <div class="alert ${alert.type}">
                        ${alert.message}
                    </div>
                `).join('');
            } else {
                alertsDiv.innerHTML = '';
            }
        }

        function showAlert(message, type = 'warning') {
            const alertsDiv = document.getElementById('alerts');
            alertsDiv.innerHTML = `
                <div class="alert ${type}">
                    ${message}
                </div>
            `;
        }

        function runCleanup() {
            if (confirm(`Run cleanup on ${currentEnvironment} environment?\n\nThis will:\n- Delete old completed jobs\n- Delete old failed jobs\n- Reset stuck jobs\n- Optimize tables`)) {
                showAlert('✅ Cleanup started. This may take a few minutes...', 'info');
                // In real implementation, this would call the cleanup script via API
                setTimeout(() => {
                    showAlert('✅ Cleanup completed successfully!', 'success');
                    refreshData();
                }, 3000);
            }
        }

        function emergencyCleanup() {
            if (confirm(`🚨 EMERGENCY CLEANUP on ${currentEnvironment}?\n\nThis will:\n- Kill all queue consumers\n- Delete massive backlog\n- Reset all stuck jobs\n- Clear cron schedule\n\nThis is a DESTRUCTIVE operation!\n\nContinue?`)) {
                showAlert('🚨 Emergency cleanup started...', 'critical');
                // In real implementation, this would call the emergency script
                setTimeout(() => {
                    showAlert('✅ Emergency cleanup completed!', 'success');
                    refreshData();
                }, 5000);
            }
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            refreshData();
            
            // Auto-refresh every 60 seconds
            autoRefreshInterval = setInterval(refreshData, 60000);
        });
    </script>
</body>
</html>
