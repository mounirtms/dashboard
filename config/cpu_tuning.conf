# System CPU Tuning Configuration for Magento
# Optimizes CPU scheduler and process management

# CPU scheduler optimizations
kernel.sched_migration_cost_ns = 5000000
kernel.sched_autogroup_enabled = 0
kernel.sched_child_runs_first = 0

# Process scheduling priorities
kernel.sched_min_granularity_ns = 10000000
kernel.sched_latency_ns = 24000000
kernel.sched_wakeup_granularity_ns = 4000000

# CPU frequency scaling (performance mode)
# These would typically be set via cpupower or similar tools
# governor=performance

# IRQ balancing optimization
# Disable irqbalance for consistent performance
# service irqbalance stop

# Network stack CPU optimization
net.core.netdev_max_backlog = 5000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000

# I/O scheduler tuning for better CPU efficiency
# This affects how disk I/O impacts CPU usage

# Process creation optimization
kernel.threads-max = 200000
kernel.pid_max = 4194304