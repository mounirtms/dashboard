# System Memory Management Configuration for Magento
# This file contains kernel parameters to optimize memory management

# Reduce swappiness to keep more data in RAM
vm.swappiness = 10

# Increase vfs cache pressure to free up more memory for applications
vm.vfs_cache_pressure = 50

# Optimize page cache behavior
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# Increase maximum map count for better memory mapping
vm.max_map_count = 262144

# Optimize memory overcommit behavior
vm.overcommit_memory = 1
vm.overcommit_ratio = 80

# TCP memory tuning
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 65536 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# File descriptor limits
fs.file-max = 1000000