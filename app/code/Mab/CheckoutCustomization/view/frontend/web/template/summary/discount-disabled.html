<!-- 
    Disabled Discount Template
    This template shows a custom message when provided, otherwise hides the discount component
-->
<div class="discount-disabled" data-bind="visible: customMessage">
    <div class="message info" data-bind="html: customMessage"></div>
</div>
<!-- ko if: !customMessage -->
<div class="discount-disabled" style="display: none;"></div>
<!-- /ko -->
