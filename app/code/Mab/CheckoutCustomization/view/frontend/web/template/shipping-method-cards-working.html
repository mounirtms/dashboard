<!-- Shipping Method Cards - Working Version -->
<div class="shipping-methods-cards-wrapper" 
     data-bind="visible: isVisible"
     style="display: block; visibility: visible; opacity: 1; min-height: 50px;">
    
    <!-- Loading State -->
    <!-- ko if: isLoading -->
    <div class="shipping-cards-loading">
        <img class="custom-spinner" src="https://dev.technostationery.com/app/spinner.gif" alt="Chargement..." width="32" height="32">
        <p data-bind="text: 'Chargement des méthodes de livraison...'"></p>
    </div>
    <!-- /ko -->
    
    <!-- Error Message -->
    <!-- ko if: errorMessage() && !isLoading() -->
    <div class="shipping-cards-error">
        <svg class="error-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="9" stroke="#f44336" stroke-width="2"/>
            <path d="M10 6V10M10 14H10.01" stroke="#f44336" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span data-bind="text: errorMessage"></span>
    </div>
    <!-- /ko -->
    
    <!-- Notice Section -->
    <!-- ko if: hasMethods() && !isLoading() -->
    <div class="shipping-notice">
        <svg class="info-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="9" stroke="#2196F3" stroke-width="2"/>
            <path d="M10 6V10M10 14H10.01" stroke="#2196F3" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="notice-text">
            <span data-bind="text: 'Sélectionnez votre mode de livraison'"></span>
            <!-- ko if: currentRegion() -->
            <span data-bind="text: ' pour la région de ' + getRegionName()"></span>
            <!-- /ko -->
        </span>
    </div>
    
    <!-- Shipping Cards Grid -->
    <div class="shipping-cards-grid" data-bind="foreach: { data: getShippingMethods(), as: 'method' }">
        <div class="shipping-card" 
             data-bind="css: $parent.getCardClasses(method), 
                        click: $parent.selectMethod.bind($parent, method),
                        attr: {'data-method-code': method.method_code, 'data-amount': method.amount}">
            
            <!-- Hidden Radio (for accessibility) -->
            <input type="radio" 
                   class="shipping-radio" 
                   name="shipping_method"
                   data-bind="checked: $parent.selectedMethod, 
                              value: method.method_code,
                              attr: {id: 'shipping_' + method.method_code}">
            
            <!-- Card Content -->
            <div class="card-content">
                <!-- Left Section -->
                <div class="card-left">
                    <!-- Carrier Logo -->
                    <div class="carrier-logo">
                        <img class="carrier-img" 
                             data-bind="attr: {src: method.carrier_logo, alt: method.method_title}" 
                             onerror="this.style.opacity='0.3'">
                    </div>
                    
                    <!-- Method Info -->
                    <div class="method-info">
                        <h4 class="method-name" data-bind="text: method.method_title"></h4>
                        <p class="method-description" data-bind="text: method.description"></p>
                        
                        <!-- Delivery Time -->
                        <div class="delivery-time">
                            <svg class="clock-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M7 3.5V7L9.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <span data-bind="text: method.delivery_time"></span>
                        </div>
                    </div>
                </div>

                <!-- Right Section -->
                <div class="card-right">
                    <!-- Free Badge -->
                    <!-- ko if: method.is_free -->
                    <div class="free-badge">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0L10.4 5.6L16 6.5L12 10.4L13 16L8 13.4L3 16L4 10.4L0 6.5L5.6 5.6L8 0Z"/>
                        </svg>
                        <span>Gratuit</span>
                    </div>
                    <!-- /ko -->
                    
                    <!-- Price Badge -->
                    <!-- ko ifnot: method.is_free -->
                    <div class="price-badge">
                        <span class="price-amount" data-bind="text: method.price_formatted"></span>
                    </div>
                    <!-- /ko -->

                    <!-- Selection Check -->
                    <div class="check-indicator" data-bind="visible: $parent.isSelected(method)">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <circle cx="10" cy="10" r="9" fill="#4CAF50"/>
                            <path d="M6 10L8.5 12.5L14 7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- /ko -->
</div>

<style>
/* Shipping Cards Wrapper */
.shipping-methods-cards-wrapper {
    margin: 24px 0;
    padding: 0;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
}

/* Loading State */
.shipping-cards-loading {
    text-align: center;
    padding: 40px 20px;
}

.custom-spinner {
    display: block;
    margin: 0 auto 16px;
    width: 24px;
    height: 24px;
}

.shipping-cards-loading p {
    color: #7F8C8D;
    font-size: 14px;
}

/* Error State */
.shipping-cards-error {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #ffebee;
    border: 1px solid #f44336;
    border-radius: 8px;
    padding: 12px 16px;
    color: #c62828;
    font-size: 14px;
}

/* Notice Section */
.shipping-notice {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #E3F2FD;
    border: 1px solid #2196F3;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
}

.shipping-notice .info-icon {
    flex-shrink: 0;
}

.shipping-notice .notice-text {
    font-size: 14px;
    color: #1976D2;
    font-weight: 500;
    line-height: 1.4;
}

/* Cards Grid */
.shipping-cards-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
}

/* Shipping Card */
.shipping-card {
    background: #ffffff;
    border: 2px solid #E0E0E0;
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
}

.shipping-card:hover {
    border-color: #4CAF50;
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.15);
    transform: translateY(-2px);
}

.shipping-card.selected {
    border-color: #4CAF50;
    background: linear-gradient(135deg, #F1F8F4 0%, #FFFFFF 100%);
    box-shadow: 0 6px 16px rgba(76, 175, 80, 0.25);
}

.shipping-card.free-shipping {
    border-color: #FF9800;
}

.shipping-card.free-shipping.selected {
    border-color: #FF9800;
    background: linear-gradient(135deg, #FFF3E0 0%, #FFFFFF 100%);
}

.shipping-card.unavailable {
    opacity: 0.6;
    cursor: not-allowed;
}

/* Radio Button (hidden) */
.shipping-radio {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

/* Card Content */
.card-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.card-left {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1;
}

.card-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
}

/* Carrier Logo */
.carrier-logo {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F5F5F5;
    border-radius: 8px;
    padding: 8px;
}

.carrier-logo .carrier-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* Method Info */
.method-info {
    flex: 1;
}

.method-name {
    font-size: 16px;
    font-weight: 600;
    color: #2C3E50;
    margin: 0 0 6px 0;
    line-height: 1.3;
}

.shipping-card.selected .method-name {
    color: #4CAF50;
}

.method-description {
    font-size: 13px;
    color: #7F8C8D;
    margin: 0 0 8px 0;
    line-height: 1.4;
}

.delivery-time {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #5A6C7D;
}

/* Price Badge */
.price-badge {
    background: #E3F2FD;
    border: 1px solid #2196F3;
    border-radius: 8px;
    padding: 8px 16px;
}

.price-amount {
    font-size: 18px;
    font-weight: 700;
    color: #1976D2;
}

.shipping-card.selected .price-badge {
    background: #4CAF50;
    border-color: #4CAF50;
}

.shipping-card.selected .price-amount {
    color: #FFFFFF;
}

/* Free Badge */
.free-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
    border-radius: 8px;
    padding: 8px 16px;
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 700;
}

/* Check Indicator */
.check-indicator {
    animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes bounceIn {
    0% {
        transform: scale(0);
        opacity: 0;
    }
    50% {
        transform: scale(1.2);
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* Responsive */
@media (max-width: 767px) {
    .card-content {
        flex-direction: column;
        align-items: flex-start;
    }

    .card-left {
        width: 100%;
    }

    .card-right {
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
    }

    .carrier-logo {
        width: 48px;
        height: 48px;
    }

    .method-name {
        font-size: 15px;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    .shipping-card,
    .check-indicator {
        animation: none;
        transition: none;
    }
}
</style>
