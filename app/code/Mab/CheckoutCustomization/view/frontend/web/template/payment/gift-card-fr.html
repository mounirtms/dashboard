<!-- ko if: isVisible() -->
<div class="mab-giftcard-container" data-bind="css: {'customer-logged-in': isCustomerLoggedIn()}">
    <div class="mab-giftcard-header">
        <h3 class="mab-giftcard-title">🎁 Techno Bon Cadeau</h3>
    </div>

    <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
    <!--/ko-->

    <!-- Applied gift cards list -->
    <div class="mab-giftcard-applied-list" data-bind="visible: applyCodes().length > 0">
        <!-- ko foreach: applyCodes().split(',') -->
        <!-- ko if: $data.length > 0 -->
        <div class="mab-giftcard-applied-item">
            <span class="mab-giftcard-code" data-bind="text: $data"></span>
            <button type="button" 
                    class="mab-giftcard-remove" 
                    data-bind="text: $parent.removeText || $t('Retirer'), 
                               click: $parent.removeSelected.bind($parent, $data), 
                               attr: {title: $parent.removeText || $t('Retirer ce bon cadeau'), 'aria-label': $parent.removeText || $t('Retirer ce bon cadeau')}">
            </button>
        </div>
        <!-- /ko -->
        <!-- /ko -->
    </div>

    <!-- Gift card form -->
    <div class="mab-giftcard-form-container">
        <form action="#" class="mab-giftcard-form" onsubmit="event.preventDefault()">
            <div class="mab-giftcard-input-group">
                <div class="mab-giftcard-datalist-wrapper" data-bind="afterRender: setContainer.bind($data, $element), css: {'-active': isShowDatalist}">
                    <label class="mab-giftcard-label">
                        <span class="mab-giftcard-label-text">Code du bon cadeau</span>
                        <input type="text" 
                               class="mab-giftcard-input"
                               data-bind="
                                   click: onDatalistClick.bind($data, $element), 
                                   event: {keyup: apply.bind($data)}, 
                                   value: cardCode, 
                                   attr: {
                                       placeholder: placeholderText || $t('Ex: TECHNO-XXXX-XXXX'),
                                       'aria-label': $t('Entrez votre code bon cadeau'),
                                       'aria-describedby': 'giftcard-help'
                                   }"
                               maxlength="50">
                    </label>
                    
                    <!-- Datalist dropdown -->
                    <ul class="mab-giftcard-datalist" 
                        data-bind="visible: isShowDatalist() && (options().length > 0 || datalistMessage())"
                        role="listbox"
                        aria-label="Codes bons cadeaux disponibles">
                        <!-- ko foreach: options  -->
                        <li class="mab-giftcard-datalist-item" 
                            role="option"
                            data-bind="text: value, click: $parent.onOptionClick.bind($parent, value)"></li>
                        <!-- /ko -->
                        <!-- ko if: datalistMessage() -->
                        <li class="mab-giftcard-datalist-message" role="status" data-bind="text: datalistMessage"></li>
                        <!-- /ko -->
                    </ul>
                </div>

                <div class="mab-giftcard-actions">
                    <button type="button" 
                            class="mab-giftcard-btn mab-giftcard-btn-primary" 
                            data-bind="
                                click: apply.bind($data), 
                                text: applyText || $t('Appliquer le code'),
                                attr: {
                                    value: applyText || $t('Appliquer le code'),
                                    'aria-label': $t('Appliquer le code bon cadeau')
                                }">
                    </button>
                    
                    <button type="button" 
                            class="mab-giftcard-btn mab-giftcard-btn-secondary" 
                            data-bind="
                                click: check.bind($data), 
                                text: checkText || $t('Vérifier le solde'),
                                attr: {'aria-label': $t('Vérifier le solde du bon cadeau')}">
                    </button>
                </div>
            </div>
            <p id="giftcard-help" style="font-size: 12px; color: #666; margin: 8px 0 0 0;">
                Entrez votre code bon cadeau Techno pour l'appliquer à votre commande.
            </p>
        </form>
    </div>
</div>
<!-- /ko -->
