<!-- ko if: isComponentVisible() -->
<!-- ko if: isGiftCardEnable() -->
<div class="mab-giftcard-container compact">
    <!-- Header -->
    <div class="mab-giftcard-header">
        <h3 class="mab-giftcard-title" data-bind="text: titleText"></h3>
    </div>

    <!-- Applied gift cards list -->
    <div class="mab-giftcard-applied-list" data-bind="visible: applyCodes().length > 0">
        <!-- ko foreach: applyCodes().split(',') -->
        <!-- ko if: $data.length > 0 -->
        <div class="mab-giftcard-applied-item">
            <span class="mab-giftcard-code" data-bind="text: $data"></span>
            <button type="button"
                    class="mab-giftcard-remove"
                    data-bind="
                        text: $parent.removeText,
                        click: $parent.removeSelected.bind($parent, $data),
                        attr: {title: $parent.removeText}">
            </button>
        </div>
        <!-- /ko -->
        <!-- /ko -->
    </div>

    <!-- Gift card form -->
    <div class="mab-giftcard-form-container">
        <form action="#" class="mab-giftcard-form" onsubmit="event.preventDefault()">
            <div class="mab-giftcard-row">
                <div class="mab-giftcard-input-wrapper">
                    <input type="text"
                           class="mab-giftcard-input"
                           data-bind="
                               event: {keyup: apply.bind($data)},
                               value: cardCode,
                               attr: {
                                   placeholder: placeholderText,
                                   'aria-label': placeholderText
                               }"
                           maxlength="50"
                           autocomplete="off" />
                </div>
                <div class="mab-giftcard-actions">
                    <button type="button"
                            class="mab-giftcard-btn mab-giftcard-btn-primary"
                            data-bind="
                                click: apply.bind($data),
                                text: applyText,
                                attr: {'aria-label': applyText}">
                    </button>
                    <button type="button"
                            class="mab-giftcard-btn mab-giftcard-btn-secondary"
                            data-bind="
                                click: check.bind($data),
                                text: checkText,
                                attr: {'aria-label': checkText}">
                    </button>
                </div>
            </div>

            <!-- Balance display with expiry -->
            <div class="mab-giftcard-balance" data-bind="visible: balanceVisible">
                <div class="mab-giftcard-balance-row">
                    <span class="mab-giftcard-balance-label">Solde:</span>
                    <span class="mab-giftcard-balance-amount" data-bind="text: balanceAmount"></span>
                </div>
                <div class="mab-giftcard-status-row">
                    <span class="mab-giftcard-status-label">Statut:</span>
                    <span class="mab-giftcard-status-value" data-bind="text: balanceStatus"></span>
                </div>
                <div class="mab-giftcard-expiry-row" data-bind="visible: expiryVisible">
                    <span class="mab-giftcard-expiry-value" data-bind="text: balanceExpiry"></span>
                </div>
            </div>

            <!-- Messages -->
            <div class="mab-giftcard-messages-wrapper" data-bind="visible: errorMessage() || successMessage()">
                <div class="mab-giftcard-message error" data-bind="visible: errorMessage, text: errorMessage"></div>
                <div class="mab-giftcard-message success" data-bind="visible: successMessage, text: successMessage"></div>
            </div>
        </form>
    </div>
</div>
<!-- /ko -->
<!-- /ko -->
