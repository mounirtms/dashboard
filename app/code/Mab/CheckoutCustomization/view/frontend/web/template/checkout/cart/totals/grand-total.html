<!-- Safe Grand Total Template with Null Checking -->
<!-- ko if: isDisplayed() -->
<tr class="grand totals">
    <th class="mark" scope="row">
        <strong data-bind="i18n: 'Order Total'"></strong>
    </th>
    <td class="amount">
        <strong>
            <!-- ko if: typeof getValue === 'function' && getValue() !== null && getValue() !== undefined -->
                <span class="price" data-bind="text: getValue()"></span>
            <!-- /ko -->
            <!-- ko ifnot: typeof getValue === 'function' && getValue() !== null && getValue() !== undefined -->
                <span class="price" data-bind="text: '0.00'"></span>
            <!-- /ko -->
        </strong>
    </td>
</tr>
<!-- /ko -->
