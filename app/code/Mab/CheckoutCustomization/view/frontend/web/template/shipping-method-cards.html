<!-- Shipping Method Cards Template -->
<div class="shipping-methods-cards-wrapper">
    <div class="cards-header">
        <h3 class="section-title" data-bind="i18n: 'Select Shipping Method'"></h3>
        <p class="section-subtitle" data-bind="i18n: 'Choose your preferred delivery option'"></p>
    </div>
    
    <div id="shipping-method-cards-container" class="shipping-cards-grid" data-bind="afterRender: convertToCards">
        <!-- Cards will be dynamically inserted here by JavaScript -->
    </div>
    
    <div class="shipping-info-notice">
        <i class="icon-info-circle"></i>
        <span data-bind="i18n: 'Delivery times are estimates and may vary'"></span>
    </div>
</div>

<style>
/* Hide original shipping table when cards are displayed */
.shipping-table-hidden {
    display: none !important;
}

/* Shipping Cards Grid */
.shipping-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin: 20px 0;
}

/* Individual Shipping Card */
.shipping-card {
    background: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.shipping-card:hover {
    border-color: #4caf50;
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.2);
    transform: translateY(-2px);
}

.shipping-card.selected {
    border-color: #4caf50;
    background: linear-gradient(135deg, #e8f5e9 0%, #fff 100%);
    box-shadow: 0 6px 16px rgba(76, 175, 80, 0.3);
}

.shipping-card.free-shipping {
    border-color: #4caf50;
    background: linear-gradient(135deg, #f1f8f4 0%, #fff 100%);
}

/* Card Header */
.shipping-card .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.shipping-card .radio-wrapper {
    display: flex;
    align-items: center;
}

.shipping-card .shipping-radio {
    width: 20px;
    height: 20px;
    margin: 0;
    cursor: pointer;
    accent-color: #4caf50;
}

.shipping-card .carrier-icon {
    font-size: 32px;
    color: #666;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
    border-radius: 8px;
}

.shipping-card.selected .carrier-icon {
    background: #4caf50;
    color: #fff;
}

/* Carrier Icons */
.icon-yalidine:before { content: "🚚"; }
.icon-ecotrak:before { content: "📦"; }
.icon-store-pickup:before { content: "🏪"; }
.icon-free:before { content: "🎁"; }
.icon-default:before { content: "📮"; }
.icon-clock:before { content: "⏱️"; margin-right: 5px; }
.icon-info-circle:before { content: "ℹ️"; margin-right: 8px; }

/* Card Body */
.shipping-card .card-body {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.shipping-card .method-name {
    font-size: 16px;
    font-weight: 600;
    color: #333;
    margin: 0;
    line-height: 1.4;
}

.shipping-card.selected .method-name {
    color: #2e7d32;
}

.shipping-card .method-details {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.shipping-card .delivery-time {
    display: flex;
    align-items: center;
    font-size: 13px;
    color: #666;
}

.shipping-card .price-wrapper {
    display: flex;
    align-items: center;
    justify-content: flex-start;
}

.shipping-card .price {
    font-size: 18px;
    font-weight: 700;
    color: #2e7d32;
}

.shipping-card .free-badge {
    display: inline-block;
    background: #4caf50;
    color: #fff;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Section Header */
.cards-header {
    margin-bottom: 20px;
}

.cards-header .section-title {
    font-size: 22px;
    font-weight: 600;
    color: #333;
    margin: 0 0 8px 0;
}

.cards-header .section-subtitle {
    font-size: 14px;
    color: #666;
    margin: 0;
}

/* Shipping Info Notice */
.shipping-info-notice {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background: #e3f2fd;
    border-radius: 8px;
    border-left: 4px solid #2196f3;
    font-size: 13px;
    color: #1565c0;
    margin-top: 20px;
}

/* Responsive Design */
@media (max-width: 768px) {
    .shipping-cards-grid {
        grid-template-columns: 1fr;
        gap: 15px;
    }
    
    .shipping-card {
        padding: 16px;
    }
    
    .shipping-card .method-name {
        font-size: 15px;
    }
    
    .shipping-card .carrier-icon {
        font-size: 28px;
        width: 40px;
        height: 40px;
    }
}

@media (min-width: 769px) and (max-width: 1024px) {
    .shipping-cards-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (min-width: 1025px) {
    .shipping-cards-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

/* Loading State */
.shipping-cards-grid.loading {
    opacity: 0.6;
    pointer-events: none;
}

.shipping-cards-grid.loading:after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 40px;
    height: 40px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #4caf50;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
}
</style>
