<!-- Shipping Method Cards Template -->
<div class="shipping-methods-cards-wrapper">
    <div class="cards-header">
        <h3 class="section-title" data-bind="i18n: 'Select Shipping Method'"></h3>
        <p class="section-subtitle" data-bind="i18n: 'Choose your preferred delivery option'"></p>
    </div>

    <div id="shipping-method-cards-container" class="shipping-cards-grid" data-bind="afterRender: convertToCards">
        <!-- Cards will be dynamically inserted here by JavaScript -->
    </div>

    <div class="shipping-info-notice">
        <i class="icon-info-circle"></i>
        <span data-bind="i18n: 'Delivery times are estimates and may vary'"></span>
    </div>
</div>

<style>
/* Hide original shipping table when cards are displayed */
.shipping-table-hidden {
    display: none !important;
}

/* Shipping Cards Grid */
.shipping-cards-grid {
    display: grid;

    margin: 20px 0;

    border-color: #4caf50;
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.15);

}

.shipping-card.selected {

}

.shipping-card .check-indicator {

    transition: all 0.25s ease;
}

.shipping-card .check-indicator svg {
    color: #fff;
}

.shipping-card.selected .check-indicator {
    opacity: 1;
    transform: scale(1);
}

.shipping-card.free-shipping {
    border-color: #4caf50;
}

.shipping-card .card-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.shipping-card .card-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
}

.shipping-card .card-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-width: 100px;
}

/* Radio Button */
.shipping-card .shipping-radio {
    width: 20px;
    height: 20px;
    margin: 0;

    flex-shrink: 0;
}

.shipping-card .carrier-logo {

.shipping-card .carrier-img {

.shipping-card .method-info {

.shipping-card .delivery-time {

.cards-header {

}

.cards-header .section-title {
    font-size: 22px;
    font-weight: 600;
    color: #333;

}

.cards-header .section-subtitle {
    font-size: 14px;

    .shipping-card .method-name {

    }

        height: 40px;

@media (min-width: 769px) and (max-width: 1024px) {

        grid-template-columns: repeat(2, 1fr);

.shipping-cards-grid.loading {

.shipping-cards-grid.loading:after {

    border: 4px solid #f3f3f3;
    border-top: 4px solid #4caf50;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
