<!-- Shipping Method Cards -->
<div class="shipping-methods-cards-wrapper" data-bind="visible: isVisible, attr: {'data-region-selected': isVisible() ? 'true' : 'false'}">
    <div class="shipping-notice">
        <svg class="info-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="9" stroke="#2196F3" stroke-width="2"/>
            <path d="M10 6V10M10 14H10.01" stroke="#2196F3" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="notice-text" data-bind="text: 'Sélectionnez votre mode de livraison pour la région de ' + getRegionName()"></span>
    </div>

    <div class="shipping-cards-grid" data-bind="foreach: getShippingMethods()">
        <div class="shipping-card" 
             data-bind="css: $parent.getCardClasses($data), 
                        click: $parent.selectMethod.bind($parent, $data),
                        attr: {'data-method-code': method_code}">
            
            <!-- Radio Button (hidden, for accessibility) -->
            <input type="radio" 
                   class="shipping-radio" 
                   name="shipping_method"
                   data-bind="checked: $parent.selectedMethod, 
                              value: method_code,
                              attr: {id: 'shipping_method_' + method_code}">
            
            <!-- Card Content -->
            <div class="card-content">
                <!-- Left Section: Logo and Info -->
                <div class="card-left">
                    <div class="carrier-logo">
                        <img class="carrier-img" 
                             data-bind="attr: {src: carrier_logo, alt: method_title}" 
                             onerror="this.style.display='none'">
                    </div>
                    
                    <div class="method-info">
                        <h4 class="method-name" data-bind="text: method_title"></h4>
                        <p class="method-description" data-bind="text: description"></p>
                        
                        <div class="delivery-time">
                            <svg class="clock-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M7 3.5V7L9.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <span data-bind="text: delivery_time"></span>
                        </div>
                    </div>
                </div>

                <!-- Right Section: Price -->
                <div class="card-right">
                    <!-- ko if: is_free -->
                    <div class="free-badge">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0L10.4 5.6L16 6.5L12 10.4L13 16L8 13.4L3 16L4 10.4L0 6.5L5.6 5.6L8 0Z"/>
                        </svg>
                        <span>Gratuit</span>
                    </div>
                    <!-- /ko -->
                    
                    <!-- ko ifnot: is_free -->
                    <div class="price-badge">
                        <span class="price-amount" data-bind="text: price_formatted"></span>
                    </div>
                    <!-- /ko -->

                    <!-- Selection Indicator -->
                    <div class="check-indicator" data-bind="visible: $parent.isSelected($data)">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <circle cx="10" cy="10" r="9" fill="#4CAF50"/>
                            <path d="M6 10L8.5 12.5L14 7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Shipping Cards Wrapper */
.shipping-methods-cards-wrapper {
    margin: 24px 0;
    padding: 0;
}

/* Notice Section */
.shipping-notice {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #E3F2FD;
    border: 1px solid #2196F3;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
}

.shipping-notice .info-icon {
    flex-shrink: 0;
}

.shipping-notice .notice-text {
    font-size: 14px;
    color: #1976D2;
    font-weight: 500;
    line-height: 1.4;
}

/* Cards Grid */
.shipping-cards-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
}

/* Individual Card */
.shipping-card {
    background: #ffffff;
    border: 2px solid #E0E0E0;
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    will-change: transform, box-shadow;
}

.shipping-card:hover {
    border-color: #4CAF50;
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.15);
    transform: translateY(-2px);
}

.shipping-card.selected {
    border-color: #4CAF50;
    background: linear-gradient(135deg, #F1F8F4 0%, #FFFFFF 100%);
    box-shadow: 0 6px 16px rgba(76, 175, 80, 0.25);
}

.shipping-card.free-shipping {
    border-color: #FF9800;
}

.shipping-card.free-shipping:hover {
    border-color: #FF6F00;
    box-shadow: 0 4px 12px rgba(255, 152, 0, 0.15);
}

.shipping-card.free-shipping.selected {
    border-color: #FF9800;
    background: linear-gradient(135deg, #FFF3E0 0%, #FFFFFF 100%);
    box-shadow: 0 6px 16px rgba(255, 152, 0, 0.25);
}

/* Hide Radio Button */
.shipping-card .shipping-radio {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

/* Card Content Layout */
.shipping-card .card-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.shipping-card .card-left {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1;
}

.shipping-card .card-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
}

/* Carrier Logo */
.shipping-card .carrier-logo {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F5F5F5;
    border-radius: 8px;
    padding: 8px;
}

.shipping-card .carrier-logo .carrier-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* Method Info */
.shipping-card .method-info {
    flex: 1;
}

.shipping-card .method-name {
    font-size: 16px;
    font-weight: 600;
    color: #2C3E50;
    margin: 0 0 6px 0;
    line-height: 1.3;
}

.shipping-card.selected .method-name {
    color: #4CAF50;
}

.shipping-card .method-description {
    font-size: 13px;
    color: #7F8C8D;
    margin: 0 0 8px 0;
    line-height: 1.4;
}

/* Delivery Time */
.shipping-card .delivery-time {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #5A6C7D;
}

.shipping-card .delivery-time .clock-icon {
    color: #7F8C8D;
}

/* Price Badge */
.price-badge {
    background: #E3F2FD;
    border: 1px solid #2196F3;
    border-radius: 8px;
    padding: 8px 16px;
}

.price-badge .price-amount {
    font-size: 18px;
    font-weight: 700;
    color: #1976D2;
}

.shipping-card.selected .price-badge {
    background: #4CAF50;
    border-color: #4CAF50;
}

.shipping-card.selected .price-badge .price-amount {
    color: #FFFFFF;
}

/* Free Badge */
.free-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
    border-radius: 8px;
    padding: 8px 16px;
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 700;
}

/* Check Indicator */
.check-indicator {
    animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes bounceIn {
    0% {
        transform: scale(0);
        opacity: 0;
    }
    50% {
        transform: scale(1.2);
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* Responsive Design */
@media (min-width: 768px) {
    .shipping-cards-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 767px) {
    .shipping-card .card-content {
        flex-direction: column;
        align-items: flex-start;
    }

    .shipping-card .card-left {
        width: 100%;
    }

    .shipping-card .card-right {
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
    }

    .shipping-card .carrier-logo {
        width: 48px;
        height: 48px;
    }

    .shipping-card .method-name {
        font-size: 15px;
    }

    .shipping-notice {
        padding: 10px 12px;
    }

    .shipping-notice .notice-text {
        font-size: 13px;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    .shipping-card,
    .check-indicator {
        animation: none;
        transition: none;
    }
}

/* Print Styles */
@media print {
    .shipping-card:not(.selected) {
        display: none;
    }
}
</style>
