; PHP-FPM Pool Configuration for Magento 2.4.6 Production
; File: /opt/cpanel/ea-php82/root/etc/php-fpm.d/technostationery_com.conf

[technostationery_com]

; Pool user/group
user = technadminy7
group = technadminy7

; Socket or TCP/IP
listen = /opt/cpanel/ea-php82/root/var/run/technostationery_com.sock
listen.owner = technadminy7
listen.group = technadminy7
listen.mode = 0660

; Process Manager Settings (Optimized for 4-6 cores, 16-24GB RAM)
pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.process_idle_timeout = 10s
pm.max_requests = 2000

; Slow Request Logging
slowlog = /opt/cpanel/ea-php82/root/var/log/$pool-slow.log
request_slowlog_timeout = 10s

; Security Settings
security.limit_extensions = .php .php3 .php4 .php5 .php7 .php8

; Environment Variables
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; Magento-specific optimizations
php_admin_value[memory_limit] = 2G
php_admin_value[max_execution_time] = 1800
php_admin_value[max_input_vars] = 10000
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[zlib.output_compression] = On
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl] = 600
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 512
php_admin_value[opcache.interned_strings_buffer] = 12
php_admin_value[opcache.max_accelerated_files] = 60000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.save_comments] = 1
php_admin_value[opcache.fast_shutdown] = 1
php_admin_value[opcache.enable_cli] = 0
php_admin_value[session.auto_start] = 0
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 1000
php_admin_value[session.gc_maxlifetime] = 28800
php_admin_value[expose_php] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /opt/cpanel/ea-php82/root/var/log/php_error.log
php_admin_value[date.timezone] = UTC

; Process Priority
process.priority = -5

; Clear environment
clear_env = no

; Decorate workers output
decorate_workers_output = no