# Systemd Service Override for PHP-FPM Resource Management
# File: /etc/systemd/system/php-fpm.service.d/override.conf

[Service]
# Resource limits for PHP-FPM
LimitNOFILE=65536
LimitNPROC=8192
TasksMax=infinity

# Memory and CPU constraints
MemoryHigh=12G
MemoryMax=16G
CPUQuota=300%

# Restart policy
Restart=always
RestartSec=5
StartLimitInterval=60
StartLimitBurst=3

# Security enhancements
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/tmp /var/tmp

# Logging
StandardOutput=journal
StandardError=journal
SyslogIdentifier=php-fpm

# Process priority
Nice=-5
IOSchedulingClass=best-effort
IOSchedulingPriority=2