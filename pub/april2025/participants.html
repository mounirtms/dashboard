<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض المشاركات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --dark-color: #2c3e50;
            --light-color: #ecf0f1;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .card-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .card-title {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--dark-color);
            font-weight: 600;
        }
        
        .card-text {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .info-item i {
            width: 25px;
            color: var(--primary-color);
            margin-left: 10px;
        }
        
        .date-badge {
            background-color: var(--secondary-color);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin-top: 10px;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .error {
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            color: #e74c3c;
        }
        
        @media (max-width: 768px) {
            .album-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>معرض المشاركات</h1>
            <p class="subtitle">16 April 2025مسابقة تكنو </p>
        </header>
        
        <div id="loading" class="loading">
            <i class="fas fa-spinner fa-spin"></i>.... جار تحميل البيانات...
        </div>

        <div id="error" class="error" style="display: none;"></div>
        
        <div id="album-grid" class="album-grid">
            <!-- Cards will be dynamically inserted here -->
        </div>
        
        <footer>
            <p>© 2025 معرض المشاركات - جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // CSV file path - replace with your actual CSV file path
            const csvFilePath = 'participants.csv';
            
            // Show loading state
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error');
            const albumGrid = document.getElementById('album-grid');
            
            // Function to parse CSV data
            function parseCSV(csvText) {
                const lines = csvText.split('\n');
                const headers = lines[0].split(',');
                const result = [];
                
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i]) continue;
                    
                    const obj = {};
                    const currentline = lines[i].split(',');
                    
                    for (let j = 0; j < headers.length; j++) {
                        obj[headers[j].trim()] = currentline[j] ? currentline[j].trim() : '';
                    }
                    
                    result.push(obj);
                }
                
                return result;
            }
            
            // Function to create a card from participant data
            function createCard(participant) {
                // Format the date for display
                const createdAt = participant['Created At'] || '';
                const displayDate = createdAt ? new Date(createdAt).toLocaleDateString('ar-EG') : '';
                
                return `
                    <div class="card">
                        <img src="${participant['photo de la participation / صورة المشاركة'] || 'https://via.placeholder.com/300x250?text=No+Image'}" 
                             alt="صورة المشاركة" class="card-img">
                        <div class="card-body">
                            <h2 class="card-title">${participant['Prénom / الإسم'] || ''} ${participant['Nom / اللقب'] || ''}</h2>
                            <div class="info-item">
                                <i class="fas fa-birthday-cake"></i>
                                <span class="card-text">${participant['Age / العمر'] || ''} سنة</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <span class="card-text">${participant['Wilaya / الولاية  *'] || ''}</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-envelope"></i>
                                <span class="card-text">${participant['E-mail /البريد الإلكتروني'] || ''}</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-phone"></i>
                                <span class="card-text">${participant['Téléphone رقم الهاتف'] || ''}</span>
                            </div>
                            ${displayDate ? `<span class="date-badge">${displayDate}</span>` : ''}
                        </div>
                    </div>
                `;
            }
            
            // Fetch and process CSV data
            fetch(csvFilePath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(csvText => {
                    const participants = parseCSV(csvText);
                    
                    if (participants.length === 0) {
                        errorElement.textContent = 'لا توجد بيانات للمشاركين';
                        errorElement.style.display = 'block';
                    } else {
                        // Generate cards for each participant
                        const cardsHTML = participants.map(createCard).join('');
                        albumGrid.innerHTML = cardsHTML;
                    }
                    
                    loadingElement.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error loading CSV file:', error);
                    loadingElement.style.display = 'none';
                    errorElement.textContent = `حدث خطأ أثناء تحميل البيانات: ${error.message}`;
                    errorElement.style.display = 'block';
                });
        });
    </script>
</body>
</html>
