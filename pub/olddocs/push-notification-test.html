<!DOCTYPE html>
<html>
<head>
    <title>Push Notification Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <h1>Push Notification Test</h1>
    <button id="testBtn">Test Push Notifications</button>
    <div id="results"></div>
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        function log(msg) {
            console.log(msg);
            document.getElementById('results').innerHTML += '<p>' + msg + '</p>';
        }
        
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        
        OneSignalDeferred.push(async function(OneSignal) {
            try {
                await OneSignal.init({
                    appId: "",
                    serviceWorkerPath: "/OneSignalSDKWorker.js",
                    serviceWorkerScope: "/",
                    autoResubscribe: true,
                    allowLocalhostAsSecureOrigin: true
                });
                
                log('OneSignal initialized');
                
                const permission = await OneSignal.getNotificationPermission();
                log('Permission: ' + permission);
                
                const isEnabled = await OneSignal.isPushNotificationsEnabled();
                log('Enabled: ' + isEnabled);
                
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    const osSW = regs.find(r => r.active && r.active.scriptURL.includes('OneSignal'));
                    log('Service Worker: ' + (osSW ? 'Found' : 'Not Found'));
                }
                
            } catch (error) {
                log('Error: ' + error.message);
            }
        });
        
        document.getElementById('testBtn').onclick = function() {
            OneSignalDeferred.push(async function(OneSignal) {
                try {
                    const permission = await OneSignal.getNotificationPermission();
                    if (permission === 'default') {
                        await OneSignal.showNativePrompt();
                        log('Prompt shown');
                    } else if (permission === 'granted') {
                        log('Already granted, sending test notification...');
                        // Would trigger actual notification here
                    } else {
                        log('Permission denied');
                    }
                } catch (error) {
                    log('Test error: ' + error.message);
                }
            });
        };
    </script>
</body>
</html>
