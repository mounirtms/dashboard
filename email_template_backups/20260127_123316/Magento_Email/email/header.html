{{depend logo_url}}
<div class="email-logo" style="text-align: center; margin-bottom: 20px;">
    <a href="{{store url=$store_url}}" style="display: block;">
        <img src="{{media url="wysiwyg/logo-techno-wt.png" _area="frontend"}}" alt="{{var logo_alt}}" style="height: 60px; max-width: 300px;"/>
    </a>
</div>
{{/depend}}
<div class="container" style="max-width: 650px; margin: 0 auto; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 4px; overflow: hidden; font-family: Arial, sans-serif;">
    <div class="header" style="background: #f8f8f8; padding: 20px; border-bottom: 1px solid #e0e0e0;">
        <h1 style="margin: 0; font-size: 24px; color: #333; text-align: center; font-weight: bold;">{{var store_name}}</h1>
    </div>
    <div class="content" style="padding: 30px;">
</div>
