<div class="mab-custom-checkout-form">
    <label data-bind="i18n: 'Custom Field'"></label>
    <input type="text" data-bind="value: customField, valueUpdate: 'input'" class="input-text" />
    <button type="button" data-bind="click: submitForm, i18n: 'Submit'" class="action primary"></button>
    <div class="message-success" data-bind="visible: successMessage, text: successMessage"></div>
    <div class="message-error" data-bind="visible: errorMessage, text: errorMessage"></div>
</div>
