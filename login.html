<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Login</title>
<style>
:root {
  --bg: #0a0e17;
  --card: #111827;
  --border: #1e293b;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --red: #ef4444;
  --green: #22c55e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-container {
  width: 100%;
  max-width: 400px;
  padding: 20px;
}
.login-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 32px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.3);
}
.login-header {
  text-align: center;
  margin-bottom: 32px;
}
.login-header h1 {
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 8px;
}
.login-header p {
  color: var(--muted);
  font-size: 0.9rem;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 0.85rem;
  color: var(--muted);
  font-weight: 500;
}
.form-group input {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 1rem;
  transition: border-color 0.2s;
}
.form-group input:focus {
  outline: none;
  border-color: var(--accent);
}
.btn-login {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 8px;
}
.btn-login:hover {
  background: var(--accent-hover);
}
.btn-login:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.error-message {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: var(--red);
  padding: 12px;
  border-radius: 8px;
  font-size: 0.85rem;
  margin-bottom: 20px;
  display: none;
}
.error-message.show {
  display: block;
}
.loading {
  display: none;
  text-align: center;
  color: var(--muted);
  font-size: 0.85rem;
  margin-top: 12px;
}
.loading.show {
  display: block;
}
.footer {
  text-align: center;
  margin-top: 24px;
  color: var(--muted);
  font-size: 0.75rem;
}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Server Control Center</h1>
      <p>Enter your credentials to access the dashboard</p>
    </div>

    <div id="error-msg" class="error-message"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="btn-submit" class="btn-login">Sign In</button>
      <div id="loading" class="loading">Signing in...</div>
    </form>
  </div>
  <div class="footer">Techno Stationery - Server Management Dashboard</div>
</div>

<script>
const API = '/api/auth.php';

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('error-msg').classList.remove('show');
}

async function handleLogin(e) {
  e.preventDefault();
  hideError();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn-submit');
  const loading = document.getElementById('loading');

  if (!username || !password) {
    showError('Please enter both username and password');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in...';
  loading.classList.add('show');

  try {
    const formData = new FormData();
    formData.append('action', 'login');
    formData.append('username', username);
    formData.append('password', password);

    const response = await fetch(API + '?action=login', {
      method: 'POST',
      body: formData
    });

    const data = await response.json();

    if (data.success) {
      window.location.href = '/';
    } else {
      showError(data.message || 'Login failed');
      document.getElementById('password').value = '';
    }
  } catch (err) {
    showError('Connection error. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
    loading.classList.remove('show');
  }
}

// Check if already logged in
async function checkSession() {
  try {
    const response = await fetch(API + '?action=check');
    const data = await response.json();
    if (data.authenticated) {
      window.location.href = '/';
    }
  } catch (e) {
    // Not logged in, show login form
  }
}

checkSession();
</script>
</body>
</html>
