<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="">
<title>Server Control Center — Login</title>
<style>
:root{--bg:#0a0e17;--card:#111827;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--accent-h:#2563eb;--red:#ef4444;--green:#22c55e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.wrap{width:100%;max-width:420px;padding:24px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:40px 34px;box-shadow:0 24px 48px rgba(0,0,0,0.35);}
.logo{text-align:center;margin-bottom:28px;}
.logo h1{font-size:1.35rem;font-weight:700;letter-spacing:-0.3px;}
.logo p{color:var(--muted);font-size:0.84rem;margin-top:5px;}
.status-bar{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.s-pill{font-size:0.72rem;padding:3px 9px;border-radius:9999px;border:1px solid;}
.s-pill.ok{background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.3);color:#22c55e;}
.s-pill.down{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#ef4444;}
.s-pill.chk{background:rgba(148,163,184,0.1);border-color:rgba(148,163,184,0.2);color:var(--muted);}
.fg{margin-bottom:18px;}
.fg label{display:block;margin-bottom:5px;font-size:0.82rem;color:var(--muted);font-weight:500;}
.fg input{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.95rem;transition:border-color 0.2s;}
.fg input:focus{outline:none;border-color:var(--accent);}
.btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:0.95rem;font-weight:600;cursor:pointer;transition:background 0.2s;margin-top:4px;}
.btn:hover{background:var(--accent-h);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.err{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--red);padding:10px 12px;border-radius:7px;font-size:0.82rem;margin-bottom:16px;display:none;}
.err.show{display:block;}
.footer{text-align:center;margin-top:20px;color:var(--muted);font-size:0.72rem;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <h1>🖥️ Server Control Center</h1>
      <p>technostationery.com</p>
      <div class="status-bar" id="status-bar">
        <span class="s-pill chk" id="pill-db">DB ···</span>
        <span class="s-pill chk" id="pill-node">Node ···</span>
        <span class="s-pill chk" id="pill-load">Load ···</span>
      </div>
    </div>

    <div id="err-msg" class="err"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="fg">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="fg">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="login-btn">Sign In</button>
    </form>
  </div>
  <div class="footer">v3.1.0 &nbsp;·&nbsp; <span id="server-time"></span></div>
</div>

<script>
// Load server status pills
async function loadStatus() {
  try {
    const r = await fetch('/api/status.php');
    const d = await r.json();
    const dp = document.getElementById('pill-db');
    const np = document.getElementById('pill-node');
    const lp = document.getElementById('pill-load');
    dp.textContent = 'DB ' + (d.services.db === 'ok' ? '✓' : '✗');
    dp.className = 's-pill ' + (d.services.db === 'ok' ? 'ok' : 'down');
    np.textContent = 'Node ' + (d.services.node === 'ok' ? '✓' : '✗');
    np.className = 's-pill ' + (d.services.node === 'ok' ? 'ok' : 'down');
    const lv = d.load['1m'];
    lp.textContent = 'Load ' + lv;
    lp.className = 's-pill ' + (lv < 4 ? 'ok' : lv < 8 ? 'chk' : 'down');
  } catch(e) {}
}

// Load CSRF token
let csrfToken = '';
async function loadCSRFToken() {
  try {
    const r = await fetch('/api/auth.php?action=csrf_token');
    const d = await r.json();
    if (d.success) {
      csrfToken = d.csrf_token;
      document.querySelector('meta[name="csrf-token"]').content = csrfToken;
    }
  } catch(e) {
    console.error('Failed to load CSRF token:', e);
  }
}

// Show clock
function tick() {
  document.getElementById('server-time').textContent = new Date().toLocaleTimeString();
}
tick(); setInterval(tick, 1000);
loadStatus();
loadCSRFToken();

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('err-msg');
  err.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in...';
  try {
    const fd = new FormData(document.getElementById('login-form'));
    fd.append('csrf_token', csrfToken);
    const r = await fetch('/api/auth.php?action=login', { method: 'POST', body: fd });
    const d = await r.json();
    if (d.success) {
      btn.innerHTML = '✓ Redirecting...';
      window.location.href = '/';
    } else {
      err.textContent = d.message || 'Login failed';
      err.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
      // Reload CSRF token on failed attempt
      await loadCSRFToken();
    }
  } catch(e) {
    err.textContent = 'Server error. Please try again.';
    err.classList.add('show');
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  }
}
</script>
</body>
</html>
