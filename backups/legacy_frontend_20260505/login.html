<script>
async function loadStatus() {
  try {
    const r = await fetch('/api/status.php');
    const d = await r.json();
    const dp = document.getElementById('pill-db');
    const np = document.getElementById('pill-node');
    const lp = document.getElementById('pill-load');
    dp.textContent = 'DB ' + (d.services.db === 'ok' ? '✓' : '✗');
    dp.className = 's-pill ' + (d.services.db === 'ok' ? 'ok' : 'down');
    np.textContent = 'Node ' + (d.services.node === 'ok' ? '✓' : '✗');
    np.className = 's-pill ' + (d.services.node === 'ok' ? 'ok' : 'down');
    const lv = d.load['1m'];
    lp.textContent = 'Load ' + lv;
    lp.className = 's-pill ' + (lv < 4 ? 'ok' : lv < 8 ? 'chk' : 'down');
  } catch(e) {}
}

let csrfToken = '';
async function loadCSRFToken() {
  try {
    const r = await fetch('/api/auth.php?action=csrf_token');
    const d = await r.json();
    if (d.success) {
      csrfToken = d.csrf_token;
      document.querySelector('meta[name="csrf-token"]').content = csrfToken;
    }
  } catch(e) {
    console.error('Failed to load CSRF token:', e);
  }
}

function tick() {
  document.getElementById('server-time').textContent = new Date().toLocaleTimeString();
}
tick(); setInterval(tick, 1000);
loadStatus();
loadCSRFToken();

// Load remembered username
(function loadRememberedUser() {
  try {
    const saved = localStorage.getItem('dashboard_username');
    if (saved) {
      document.getElementById('username').value = saved;
      document.getElementById('remember-me').checked = true;
    }
  } catch(e) {}
})();

// Escape key to clear errors
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const err = document.getElementById('err-msg');
    if (err.classList.contains('show')) {
      err.classList.remove('show');
      document.getElementById('username').focus();
    }
  }
});

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('err-msg');
  const rememberMe = document.getElementById('remember-me').checked;
  err.classList.remove('show');
  err.classList.remove('shake');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in...';
  try {
    const fd = new FormData(document.getElementById('login-form'));
    fd.append('csrf_token', csrfToken);
    const r = await fetch('/api/auth.php?action=login', { method: 'POST', body: fd });
    const d = await r.json();
    if (d.success) {
      // Save or clear remembered username
      try {
        if (rememberMe) {
          localStorage.setItem('dashboard_username', document.getElementById('username').value);
        } else {
          localStorage.removeItem('dashboard_username');
        }
      } catch(e) {}
      btn.innerHTML = '✓ Redirecting...';
      window.location.href = '/';
    } else {
      err.textContent = d.message || 'Login failed';
      err.classList.add('show');
      // Trigger shake animation
      void err.offsetWidth; // force reflow to restart animation
      err.classList.add('shake');
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
      await loadCSRFToken();
      // Focus username after a brief delay
      setTimeout(() => document.getElementById('username').focus(), 100);
    }
  } catch(e) {
    err.textContent = 'Server error. Please try again.';
    err.classList.add('show');
    void err.offsetWidth;
    err.classList.add('shake');
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  }
}
</script>
