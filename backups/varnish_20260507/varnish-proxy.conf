# Proxy HTTPS traffic to Varnish for caching
<VirtualHost 205.134.249.177:443>
    ServerName technostationery.com
    ServerAlias www.technostationery.com beta.technostationery.com dev.technostationery.com pim.technostationery.com dashboard.technostationery.com

    SSLEngine on
    SSLCertificateFile /var/cpanel/ssl/apache_tls/technostationery.com/combined

    # Proxy all requests to Varnish on port 8888
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8888/
    ProxyPassReverse / http://127.0.0.1:8888/

    # Set proper headers for Varnish
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # Preserve Varnish cache headers in response
    Header always set X-Cache "%{X-Cache}e" env=X-Cache
    Header always set X-UA-Device "%{X-UA-Device}e" env=X-UA-Device

    # Logging
    ErrorLog /etc/apache2/logs/domlogs/technostationery.com-ssl-error.log
    CustomLog /etc/apache2/logs/domlogs/technostationery.com-ssl.log combined
</VirtualHost>
